<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="lcEnQqlHszcTuVWWiz9zt9KWniLqSTNprz-uhc9ByJg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Gulf Jobs & Classifieds | GulfJobsHub</title>
<meta name="description" content="Search job listings across Saudi Arabia, UAE, Qatar, Kuwait, Bahrain and Oman.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#0b5e8e">
<link rel="stylesheet" href="site.css">
<script defer src="site.js"></script>
</head>
<body class="classified-search-page">
<section class="page-hero">
  <div class="container">
    <div class="crumbs"><a href="index.html">Home</a> / Search Jobs</div>
    <h1>Search Gulf Jobs</h1>
    <p>Find opportunities across Saudi Arabia, UAE, Qatar, Kuwait, Bahrain and Oman.</p>
  </div>
</section>
<main class="container section">
  <div class="search-page-layout">
    <aside class="search-sidebar">
      <form id="filterForm" class="filter-box">
        <h3>Filter listings</h3>
        <div class="form-field">
          <label for="q">Keyword or title</label>
          <input id="q" name="q" type="search" placeholder="e.g. Engineer, Nurse">
        </div>
        <div class="form-field">
          <label for="country">Country</label>
          <select id="country" name="country">
            <option value="">All GCC countries</option>
            <option>Saudi Arabia</option>
            <option>UAE</option>
            <option>Qatar</option>
            <option>Kuwait</option>
            <option>Bahrain</option>
            <option>Oman</option>
          </select>
        </div>
        <div class="form-field">
          <label for="city">City</label>
          <select id="city" name="city">
            <option value="">All cities</option>
          </select>
        </div>
        <div class="filter-actions">
          <button class="btn btn-primary btn-sm" type="submit">Search</button>
          <button class="btn btn-outline btn-sm" type="button" id="clearAll">Clear</button>
        </div>
      </form>
    </aside>
    <section class="search-results-area">
      <div class="results-head">
        <h2 id="resultsHeading">Search results</h2>
        <span id="resultsCount" class="muted"></span>
      </div>
      <div id="jobResults" class="job-list" aria-live="polite"></div>
    </section>
  </div>
</main>
</body>
</html>
